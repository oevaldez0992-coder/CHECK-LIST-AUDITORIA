<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Iniciar sesión — Auditorías</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
 --ink:#1B2430; --ink-soft:#5B677A; --paper:#F7F6F2; --panel:#FFFFFF; --line:#DEDACD;
 --accent:#8A5A2B; --accent-bg:#F2E4D3; --err:#B23A2E; --errbg:#F6DAD6;
 --serif:'IBM Plex Serif',Georgia,serif; --sans:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
 --ink:#EDEAE2; --ink-soft:#A9B2C0; --paper:#161512; --panel:#201E1A; --line:#39352C; --accent:#D9A870; --accent-bg:#332A1D; --err:#E28A7D; --errbg:#3A2420;
}}
:root[data-theme="dark"]{ --ink:#EDEAE2; --ink-soft:#A9B2C0; --paper:#161512; --panel:#201E1A; --line:#39352C; --accent:#D9A870; --accent-bg:#332A1D; --err:#E28A7D; --errbg:#3A2420; }
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;background:var(--paper);color:var(--ink);font-family:var(--sans);padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:32px 28px}
.brand{font-family:var(--serif);font-weight:700;font-size:19px;margin:0 0 2px}
.brand span{color:var(--accent)}
.sub{color:var(--ink-soft);font-size:13px;margin:0 0 26px}
label{display:block;font-size:12.5px;color:var(--ink-soft);margin:0 0 5px;font-family:var(--mono)}
input{width:100%;border:1px solid var(--line);border-radius:3px;padding:10px 11px;background:var(--paper);color:var(--ink);font-size:14px;margin-bottom:16px}
input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{width:100%;border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:3px;cursor:pointer;font-weight:600;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.err{background:var(--errbg);color:var(--err);border-radius:3px;padding:9px 11px;font-size:13px;margin:0 0 16px;display:none}
.err.show{display:block}
.panel-ok{display:none;text-align:center}
.panel-ok.show{display:block}
.panel-ok .n{font-family:var(--serif);font-size:20px;font-weight:600;margin:14px 0 4px}
.panel-ok .r{display:inline-block;font-family:var(--mono);font-size:11.5px;color:var(--accent);background:var(--accent-bg);padding:3px 10px;border-radius:99px;margin-bottom:22px}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--accent-bg);color:var(--accent);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:20px;margin:0 auto}
.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
#formLogin.hide,#panelOk.hide{display:none}
</style>
</head>
<body>
<div class="card">
 <div class="brand">Check<span>List</span> · Auditorías</div>
 <p class="sub">Acceso de administrador</p>

 <form id="formLogin">
  <div class="err" id="err"></div>
  <label for="email">Correo</label>
  <input id="email" type="email" autocomplete="username" value="oamavizca@kuroda.com" required>
  <label for="pass">Contraseña</label>
  <input id="pass" type="password" autocomplete="current-password" required>
  <button class="btn" id="btnEntrar" type="submit">Entrar</button>
 </form>

 <div class="panel-ok" id="panelOk">
  <div class="avatar" id="avatarTxt">OA</div>
  <div class="n" id="nombreTxt">—</div>
  <div class="r" id="rolTxt">—</div>
  <button class="btn ghost" id="btnSalir">Cerrar sesión</button>
 </div>
</div>

<script>
const SUPABASE_URL = 'https://prqgywyhszivaqkppalx.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBycWd5d3loc3ppdmFxa3BwYWx4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4MzM4MTYsImV4cCI6MjEwMDQwOTgxNn0.RLby7xZL26Z4QBJL2v7HebxRw6FSCRgbm52K86CIW3Q';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const form = document.getElementById('formLogin');
const panelOk = document.getElementById('panelOk');
const errBox = document.getElementById('err');
const btn = document.getElementById('btnEntrar');

function showError(msg){ errBox.textContent = msg; errBox.classList.add('show'); }
function clearError(){ errBox.classList.remove('show'); errBox.textContent=''; }

async function showProfile(authUser){
 const { data, error } = await sb.from('usuarios').select('nombre, rol, puesto').eq('auth_user_id', authUser.id).maybeSingle();
 const nombre = data?.nombre || authUser.email;
 const rol = data?.rol || 'Sin perfil en usuarios';
 document.getElementById('nombreTxt').textContent = nombre;
 document.getElementById('rolTxt').textContent = rol;
 document.getElementById('avatarTxt').textContent = nombre.split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
 form.classList.add('hide');
 panelOk.classList.add('show');
}

form.addEventListener('submit', async (e)=>{
 e.preventDefault();
 clearError();
 btn.disabled = true; btn.textContent = 'Entrando…';
 const email = document.getElementById('email').value.trim();
 const password = document.getElementById('pass').value;
 const { data, error } = await sb.auth.signInWithPassword({ email, password });
 btn.disabled = false; btn.textContent = 'Entrar';
 if(error){ showError(error.message === 'Invalid login credentials' ? 'Correo o contraseña incorrectos.' : error.message); return; }
 await showProfile(data.user);
});

document.getElementById('btnSalir').addEventListener('click', async ()=>{
 await sb.auth.signOut();
 panelOk.classList.remove('show');
 form.classList.remove('hide');
 document.getElementById('pass').value = '';
});

// Si ya hay una sesión activa (recarga de página), la respeta
sb.auth.getSession().then(({data})=>{ if(data.session) showProfile(data.session.user); });
</script>
</body>
</html>
