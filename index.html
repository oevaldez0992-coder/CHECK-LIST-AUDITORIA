<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CheckList · Auditorías</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
 --ink:#1B2430; --ink-soft:#5B677A; --paper:#F7F6F2; --panel:#FFFFFF; --line:#DEDACD;
 --accent:#8A5A2B; --accent-bg:#F2E4D3;
 --pend:#B4682B; --pendbg:#F7E7D8; --venc:#B23A2E; --vencbg:#F6DAD6;
 --rev:#8A6D1E; --revbg:#F3EACB; --done:#3F6B4A; --donebg:#DEEAE0;
 --serif:'IBM Plex Serif',Georgia,serif; --sans:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
 --ink:#EDEAE2; --ink-soft:#A9B2C0; --paper:#161512; --panel:#201E1A; --line:#39352C; --accent:#D9A870; --accent-bg:#332A1D;
 --pend:#E3A46A; --pendbg:#33261A; --venc:#E28A7D; --vencbg:#3A2420; --rev:#D9C168; --revbg:#312B17; --done:#8FC29E; --donebg:#1D2C22;
}}
:root[data-theme="dark"]{
 --ink:#EDEAE2; --ink-soft:#A9B2C0; --paper:#161512; --panel:#201E1A; --line:#39352C; --accent:#D9A870; --accent-bg:#332A1D;
 --pend:#E3A46A; --pendbg:#33261A; --venc:#E28A7D; --vencbg:#3A2420; --rev:#D9C168; --revbg:#312B17; --done:#8FC29E; --donebg:#1D2C22;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{background:var(--paper);padding:14px 18px 4px}
.htop{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;max-width:1000px;margin:0 auto}
.brand{font-family:var(--serif);font-weight:700;font-size:17px;margin-right:auto}
.brand span{color:var(--accent)}
select,textarea,button,input{font-family:var(--sans);font-size:13.5px}
select{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:7px 9px}
/* Solo la barra de pestañas queda fija al hacer scroll: ocupa poco alto en el celular */
nav{position:sticky;top:0;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding:0 18px}
.navin{display:flex;gap:4px;max-width:1000px;margin:0 auto}
nav button{background:none;border:1px solid transparent;border-bottom:2px solid transparent;color:var(--ink-soft);padding:8px 12px;cursor:pointer;font-weight:500;border-radius:3px 3px 0 0}
nav button.on{color:var(--ink);border-bottom:2px solid var(--accent)}
main{max-width:1000px;margin:0 auto;padding:22px 18px 90px}
h1.pt{font-family:var(--serif);font-size:22px;margin:0 0 4px}
.sub{color:var(--ink-soft);font-size:13.5px;margin:0 0 20px}
.sec-title{font-family:var(--mono);font-size:12px;letter-spacing:.02em;color:var(--accent);margin:26px 0 8px;text-transform:uppercase}
.sec-title:first-child{margin-top:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px 16px;margin-bottom:10px}
.qrow{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.qtxt{font-size:14.5px;max-width:56ch}
.toggle{display:flex;gap:6px;flex-shrink:0}
.toggle button{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 14px;border-radius:3px;cursor:pointer;font-weight:500}
.toggle button.sel-si{background:var(--vencbg);border-color:var(--venc);color:var(--venc)}
.toggle button.sel-no{background:var(--donebg);border-color:var(--done);color:var(--done)}
.qmore{display:flex;gap:8px;margin-top:10px;align-items:flex-start}
.qmore textarea{flex:1;border:1px solid var(--line);border-radius:3px;padding:7px 9px;resize:vertical;min-height:34px;background:var(--paper);color:var(--ink)}
.foto-btn{border:1px dashed var(--line);background:var(--paper);color:var(--ink-soft);border-radius:3px;padding:7px 10px;cursor:pointer;white-space:nowrap}
.foto-btn.on{border-style:solid;border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
.badge{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:99px;white-space:nowrap}
.b-pend{background:var(--pendbg);color:var(--pend)} .b-venc{background:var(--vencbg);color:var(--venc)}
.b-rev{background:var(--revbg);color:var(--rev)} .b-done{background:var(--donebg);color:var(--done)}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:3px;cursor:pointer;font-weight:600}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line)}
.result{background:var(--accent-bg);border:1px solid var(--accent);border-radius:4px;padding:14px 16px;margin:16px 0;font-size:14px}
.taskcard{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px 16px;margin-bottom:12px}
.taskhead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:6px}
.taskhead h4{margin:0;font-size:14.5px;font-family:var(--sans)}
.meta{font-size:12px;color:var(--ink-soft);margin-bottom:8px}
.evid{background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:9px 11px;font-size:13px;margin:8px 0}
.row2{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0 20px}
.stat{border:1px solid var(--line);border-radius:4px;padding:14px 16px}
.stat .n{font-family:var(--serif);font-size:28px;font-weight:700;line-height:1}
.stat .l{font-size:12px;color:var(--ink-soft);margin-top:3px}
.stat.pend{background:var(--pendbg)} .stat.venc{background:var(--vencbg)} .stat.rev{background:var(--revbg)} .stat.done{background:var(--donebg)}
.stat.pend .n{color:var(--pend)} .stat.venc .n{color:var(--venc)} .stat.rev .n{color:var(--rev)} .stat.done .n{color:var(--done)}
.bars{display:flex;flex-direction:column;gap:8px;margin:10px 0 20px}
.bar-row{display:grid;grid-template-columns:150px 1fr 28px;gap:8px;align-items:center;font-size:12.5px}
.bar-row>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{background:var(--paper);border:1px solid var(--line);border-radius:2px;height:12px;overflow:hidden}
.bar-fill{height:100%;background:var(--pend)}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
th{font-family:var(--mono);font-size:10.5px;text-align:left;color:var(--ink-soft);padding:7px 8px;border-bottom:1px solid var(--ink)}
td{padding:7px 8px;border-bottom:1px solid var(--line)}
.notiffeed{font-size:12.5px;color:var(--ink-soft);max-height:170px;overflow-y:auto;border:1px solid var(--line);border-radius:4px;padding:10px 12px;background:var(--panel)}
.notiffeed div{padding:3px 0;border-bottom:1px dashed var(--line)}
.notiffeed div:last-child{border-bottom:none}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.empty{color:var(--ink-soft);font-size:13.5px;padding:20px 0;text-align:center}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#app{animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){#app{animation:none}}
.progwrap{display:flex;align-items:center;gap:10px;margin:0 0 18px}
.progtrack{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.progfill{height:100%;background:var(--accent);transition:width .25s ease}
.progtxt{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);white-space:nowrap}
.stickybar{position:sticky;bottom:0;bottom:env(safe-area-inset-bottom,0px);background:var(--paper);border-top:1px solid var(--line);margin:20px -18px -90px;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:flex-end;gap:10px}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));width:max-content;max-width:calc(100vw - 32px);z-index:50;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--paper);font-size:13px;padding:9px 16px;border-radius:99px;box-shadow:0 4px 14px rgba(0,0,0,.18);animation:toastIn .18s ease, toastOut .25s ease 2.6s forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastOut{to{opacity:0;transform:translateY(-4px)}}
/* ---------- Login (Supabase) ---------- */
body.locked header, body.locked nav, body.locked main{display:none}
body:not(.locked) #auth{display:none}
#auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.auth-card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:28px 24px}
.auth-card .brand{font-size:22px;margin:0 0 4px}
.auth-card h2{font-family:var(--serif);font-size:17px;margin:18px 0 14px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:12.5px;color:var(--ink-soft);font-weight:500}
.field input{border:1px solid var(--line);border-radius:3px;padding:10px 11px;background:var(--paper);color:var(--ink);font-size:14px}
.auth-card .btn{width:100%;margin-top:4px}
.auth-links{display:flex;justify-content:space-between;gap:10px;margin-top:14px;font-size:12.5px;flex-wrap:wrap}
.linkbtn{background:none;border:none;color:var(--accent);cursor:pointer;padding:0;font-size:12.5px;text-decoration:underline}
.auth-msg{font-size:13px;border-radius:3px;padding:9px 11px;margin-bottom:12px;display:none}
.auth-msg.err{display:block;background:var(--vencbg);color:var(--venc);border:1px solid var(--venc)}
.auth-msg.ok{display:block;background:var(--donebg);color:var(--done);border:1px solid var(--done)}
.auth-cfg{font-size:12px;background:var(--revbg);color:var(--rev);border:1px solid var(--rev);border-radius:3px;padding:9px 11px;margin-top:10px}
.userbox{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-soft)}
.userbox .btn{padding:6px 12px;font-size:12.5px}
.fotos{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.fotos a{display:block;width:84px;height:84px;border:1px solid var(--line);border-radius:3px;overflow:hidden;background:var(--paper)}
.fotos img{width:100%;height:100%;object-fit:cover;display:block}
.firma-nombre{width:100%;max-width:300px;border:1px solid var(--line);border-radius:3px;padding:7px 9px;background:var(--paper);color:var(--ink);margin-bottom:6px;display:block}
.aviso{font-size:12.5px;color:var(--venc);margin-left:auto;align-self:center}
.firmas{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:0 24px}
.toast{text-align:center}

/* ================= RESPONSIVE =================
   PC: > 1024px · Tablet: 601–1024px · Celular: ≤ 600px
   Pantallas táctiles (celular y tablet): botones de al menos 44px de alto */
@media (pointer:coarse){
 .toggle button{min-height:44px;min-width:60px}
 .btn,.foto-btn{min-height:44px}
 nav button{min-height:44px}
 .linkbtn{padding:8px 0}
}
@media (min-width:1025px){
 main,.htop,.navin{max-width:1100px}
 .stat-grid{grid-template-columns:repeat(4,1fr)}
}
@media (min-width:601px) and (max-width:1024px){
 header{padding:14px 24px 4px} nav{padding:0 24px} main{padding:22px 24px 90px}
 .stickybar{margin:20px -24px -90px;padding-left:24px;padding-right:24px}
 .stat-grid{grid-template-columns:repeat(4,1fr)}
 /* Por si la tablet no se reporta como táctil */
 .toggle button{min-height:44px;min-width:60px}
 .btn,.foto-btn,nav button{min-height:44px}
}
@media (max-width:600px){
 /* 16px evita que el iPhone haga zoom al tocar un campo */
 select,textarea,input,.field input{font-size:16px}
 header{padding:12px 16px 2px} nav{padding:0 16px} main{padding:18px 16px 90px}
 .htop{gap:8px}
 .brand{font-size:16px}
 .userbox span{max-width:42vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 #selSucursal{order:3;flex:1 1 100%;min-width:0}
 .navin{gap:0}
 nav button{flex:1;padding:10px 6px}
 h1.pt{font-size:20px}
 /* Pregunta arriba y botones Sí/No a todo lo ancho, fáciles de tocar con el pulgar */
 .card,.taskcard{padding:12px}
 .qrow{flex-direction:column;gap:10px}
 .qtxt{max-width:none}
 .toggle{width:100%}
 .toggle button{flex:1}
 .qmore{flex-wrap:wrap}
 .qmore textarea{flex:1 1 100%}
 .foto-btn{flex:1 1 100%;text-align:center}
 .taskhead{align-items:flex-start}
 .row2 .btn,.row2 .foto-btn{flex:1 1 auto}
 .stickybar{margin:20px -16px -90px;padding-left:16px;padding-right:16px;align-items:center}
 .stickybar .btn{flex:1}
 .stickybar .aviso{margin-left:0;flex:0 0 auto}
 .stat{padding:12px}
 .stat .n{font-size:24px}
 .bar-row{grid-template-columns:1fr 28px;gap:4px 8px}
 .bar-row>span:first-child{grid-column:1/-1}
 /* Tablas → tarjetas: cada fila se apila con su etiqueta */
 table.rtable,table.rtable tbody,table.rtable tr,table.rtable td{display:block;width:100%}
 table.rtable tr:first-child{display:none}
 table.rtable tr{border:1px solid var(--line);border-radius:4px;background:var(--panel);padding:8px 12px;margin-bottom:8px}
 table.rtable td{border:none;padding:3px 0;display:flex;gap:12px;justify-content:space-between;text-align:right}
 table.rtable td::before{content:attr(data-label);font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);text-align:left;flex-shrink:0;padding-top:2px}
 .auth-card{padding:24px 18px}
}
</style>

<body class="locked">
<section id="auth">
 <div class="auth-card">
  <div class="brand">Check<span>List</span> · Auditorías</div>
  <h2 id="authTitle">Iniciar sesión</h2>
  <div class="auth-msg" id="authMsg"></div>
  <form id="authForm" novalidate>
   <div class="field" id="fNombre" style="display:none"><label for="aNombre">Nombre completo</label><input id="aNombre" autocomplete="name"></div>
   <div class="field"><label for="aEmail">Correo electrónico</label><input id="aEmail" type="email" autocomplete="email" required></div>
   <div class="field" id="fPass"><label for="aPass">Contraseña</label><input id="aPass" type="password" autocomplete="current-password" minlength="6" required></div>
   <button class="btn" type="submit" id="authBtn">Entrar</button>
  </form>
  <div class="auth-links">
   <button class="linkbtn" type="button" id="lnkModo">Crear cuenta</button>
   <button class="linkbtn" type="button" id="lnkReset">¿Olvidaste tu contraseña?</button>
  </div>
  <div class="auth-cfg" id="authCfg" style="display:none">Falta configurar Supabase: edita <code>SUPABASE_URL</code> y <code>SUPABASE_ANON_KEY</code> al inicio del script de login.</div>
 </div>
</section>
<header>
 <div class="htop">
  <div class="brand">Check<span>List</span> · Auditorías</div>
  <select id="selSucursal"></select>
  <div class="userbox"><span id="userEmail"></span><button class="btn ghost" id="btnLogout">Salir</button></div>
 </div>
</header>
<nav aria-label="Secciones"><div class="navin">
  <button data-v="audit" class="on">Auditoría</button>
  <button data-v="tasks">Tareas</button>
  <button data-v="dash">Reportes</button>
</div></nav>
<main id="app"></main>
<div class="toasts" id="toasts"></div>

<script>
/* ===================== CONFIG SUPABASE ===================== */
const SUPABASE_URL = 'https://prqgywyhszivaqkppalx.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_YG2hI2w5D7JiXAmfdIQSUQ_FwSnUdXH';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);

/* ===================== AUTENTICACIÓN ===================== */
let modo = 'login'; // login | signup | reset | newpass
const TEXTOS = {
 login:  {t:'Iniciar sesión', b:'Entrar', l:'Crear cuenta'},
 signup: {t:'Crear cuenta', b:'Registrarme', l:'Ya tengo cuenta'},
 reset:  {t:'Recuperar contraseña', b:'Enviar enlace', l:'Volver a iniciar sesión'},
 newpass:{t:'Nueva contraseña', b:'Guardar contraseña', l:'Volver a iniciar sesión'}
};
function setModo(m){
 modo = m; msg('');
 $('authTitle').textContent = TEXTOS[m].t;
 $('authBtn').textContent = TEXTOS[m].b;
 $('lnkModo').textContent = TEXTOS[m].l;
 $('fNombre').style.display = m==='signup' ? '' : 'none';
 $('fPass').style.display = m==='reset' ? 'none' : '';
 $('aEmail').parentElement.style.display = m==='newpass' ? 'none' : '';
 $('aPass').autocomplete = (m==='login') ? 'current-password' : 'new-password';
 $('lnkReset').style.display = m==='login' ? '' : 'none';
}
function msg(text, tipo='err'){ const el=$('authMsg'); el.textContent=text; el.className='auth-msg'+(text?' '+tipo:''); }
function traducir(e){
 const m = (e && e.message) || String(e);
 if(/Invalid login credentials/i.test(m)) return 'Correo o contraseña incorrectos.';
 if(/Email not confirmed/i.test(m)) return 'Confirma tu correo antes de iniciar sesión (revisa tu bandeja).';
 if(/already registered/i.test(m)) return 'Ese correo ya está registrado.';
 if(/at least 6/i.test(m)) return 'La contraseña debe tener al menos 6 caracteres.';
 if(/rate limit/i.test(m)) return 'Demasiados intentos. Espera un momento e inténtalo de nuevo.';
 return m;
}

$('lnkModo').addEventListener('click', ()=> setModo(modo==='login' ? 'signup' : 'login'));
$('lnkReset').addEventListener('click', ()=> setModo('reset'));

$('authForm').addEventListener('submit', async e=>{
 e.preventDefault();
 const email = $('aEmail').value.trim(), pass = $('aPass').value, nombre = $('aNombre').value.trim();
 if(modo!=='newpass' && !email){ msg('Escribe tu correo.'); return; }
 if(modo!=='reset' && pass.length<6){ msg('La contraseña debe tener al menos 6 caracteres.'); return; }
 const btn = $('authBtn'); btn.disabled = true; const txt = btn.textContent; btn.textContent = 'Procesando…';
 try{
  if(modo==='login'){
   const {error} = await sb.auth.signInWithPassword({email, password:pass});
   if(error) throw error;
  } else if(modo==='signup'){
   const {data, error} = await sb.auth.signUp({email, password:pass, options:{data:{nombre}, emailRedirectTo: location.href.split('#')[0]}});
   if(error) throw error;
   if(!data.session){ setModo('login'); msg('Cuenta creada. Revisa tu correo para confirmarla y luego inicia sesión.','ok'); }
  } else if(modo==='reset'){
   const {error} = await sb.auth.resetPasswordForEmail(email, {redirectTo: location.href.split('#')[0]});
   if(error) throw error;
   msg('Si el correo existe, te enviamos un enlace para restablecer la contraseña.','ok');
  } else if(modo==='newpass'){
   const {error} = await sb.auth.updateUser({password:pass});
   if(error) throw error;
   setModo('login'); toast('Contraseña actualizada');
   const {data} = await sb.auth.getSession(); mostrarApp(data.session);
  }
 }catch(err){ msg(traducir(err)); }
 finally{ btn.disabled = false; if(btn.textContent==='Procesando…') btn.textContent = txt; }
});

$('btnLogout').addEventListener('click', async ()=>{ await sb.auth.signOut(); });

let sesionActual = null;
function mostrarApp(session){
 const logged = !!session && modo!=='newpass';
 document.body.classList.toggle('locked', !logged);
 if(logged && (!sesionActual || sesionActual.user.id!==session.user.id)){
  sesionActual = session;
  boot(session);
 } else if(!logged){
  sesionActual = null;
 }
}

sb.auth.onAuthStateChange((event, session)=>{
 if(event==='PASSWORD_RECOVERY'){ setModo('newpass'); document.body.classList.add('locked'); return; }
 if(event==='SIGNED_IN' && modo!=='newpass') toast('Bienvenido');
 if(event==='SIGNED_OUT'){ setModo('login'); $('aPass').value=''; sesionActual=null; limpiarSesion(); }
 mostrarApp(session);
});
sb.auth.getSession().then(({data})=> mostrarApp(data.session));

/* ===================== ESTADO Y DATOS ===================== */
let PERFIL = null;        // fila de public.usuarios del usuario logueado
let SECCIONES = [];
let PUNTOS = [];           // preguntas normalizadas {id,sec,texto,tipo,area,instruccion,revisorRol,plazoResolver,plazoAprobar}
let SUCURSALES = [];       // {c,t,r}
let RAZONES = {};          // {clave: etiqueta}
let TASKS = [];
let NOTIFS = [];
let pendingTaskFile = {};  // {tareaId: File}
let realtimeCh = null;
let DASH = null;          // conteos y cumplimiento calculados en la base de datos

const ROLES_BLOQUEADOS_SUCURSAL = ['Jefe de Almacen Operativo','Jefe de Almacen Administrativo','Gerente'];

// Borra de memoria todo lo del usuario anterior (importante en equipos compartidos)
function limpiarSesion(){
 if(realtimeCh){ sb.removeChannel(realtimeCh); realtimeCh = null; }
 PERFIL = null; TASKS = []; NOTIFS = []; DASH = null; pendingTaskFile = {};
 Object.assign(state, estadoAuditoriaVacio(), {view:'audit'});
 document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on', x.dataset.v==='audit'));
 $('userEmail').textContent = ''; document.getElementById('app').innerHTML = '';
}
function fechaHora(f){ return new Date(f).toLocaleString('es-MX',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }
function toast(msgTxt){
 const box = document.getElementById('toasts');
 const el = document.createElement('div'); el.className='toast'; el.textContent=msgTxt;
 box.appendChild(el); setTimeout(()=>el.remove(), 3000);
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function addDias(n){ const d=new Date(); d.setDate(d.getDate()+(n||0)); return d.toISOString(); }
function diasRestantes(fecha){ if(!fecha) return null; return Math.ceil((new Date(fecha)-new Date())/86400000); }
async function registrarHistorial(auditoriaId, accion){
 try{ await sb.from('historial').insert({auditoria_id:auditoriaId||null, usuario_nombre:PERFIL?.nombre||'—', accion}); }catch(e){ /* no bloquea la UI */ }
}

/* ---------- arranque tras iniciar sesión ---------- */
async function boot(session){
 document.getElementById('app').innerHTML = '<p class="empty">Cargando tu perfil y el checklist…</p>';
 try{
  let {data:perfil, error} = await sb.from('usuarios').select('id, auth_user_id, nombre, rol, puesto, sucursal_centro, activo').eq('auth_user_id', session.user.id).maybeSingle();
  if(error) throw error;
  if(!perfil){
   document.getElementById('app').innerHTML = '<div class="result">Tu cuenta no tiene todavía un perfil en el sistema. Pide a un administrador que te asigne rol y sucursal, o intenta cerrar sesión y volver a entrar en unos segundos.</div>';
   return;
  }
  PERFIL = perfil;
  $('userEmail').textContent = `${perfil.nombre} · ${perfil.rol}`;
 }catch(err){
  document.getElementById('app').innerHTML = `<div class="result">No se pudo cargar tu perfil: ${esc(err.message||err)}</div>`;
  return;
 }

 const okCatalogos = await cargarCatalogos();
 if(!okCatalogos){
  document.getElementById('app').innerHTML = '<div class="result">No hay conexión y no hay datos guardados localmente todavía. Conéctate a internet al menos una vez para cargar el checklist.</div>';
  return;
 }
 poblarSucursales();

 // Oculta "Reportes" para roles de tienda (solo Administrador/Supervisor/Auditor lo ven)
 const esGerencial = ['Administrador','Supervisor'].includes(PERFIL.rol) || PERFIL.puesto==='Auditor';
 document.querySelector('nav button[data-v="dash"]').style.display = esGerencial ? '' : 'none';

 // Solo se usa en el selector "Ver como" de Administrador/Supervisor
 state.rolTareas = PERFIL.puesto==='Auditor' ? 'Auditor' : 'Jefe de Almacén';
 cargarBorrador();

 await cargarTareas();
 await cargarHistorial();
 suscribirHistorialRealtime();
 render();
}

async function cargarCatalogos(){
 try{
  const [{data:secc,error:e1},{data:pts,error:e2},{data:suc,error:e3},{data:raz,error:e4}] = await Promise.all([
   sb.from('secciones').select('*').order('orden'),
   sb.from('puntos').select('*, secciones(nombre,orden)').order('orden'),
   sb.from('sucursales').select('*').eq('activa', true).order('centro'),
   sb.from('razones_sociales').select('*')
  ]);
  if(e1||e2||e3||e4) throw (e1||e2||e3||e4);
  SECCIONES = secc||[];
  PUNTOS = (pts||[]).map(p=>({
   id:p.id, sec:(p.secciones && p.secciones.nombre) || 'General', secOrden:(p.secciones && p.secciones.orden)||0, orden:p.orden||0,
   texto:p.pregunta, tipo: p.logica_negativa ? 'Negativo':'Positivo',
   area: p.responsable_rol || 'Sin asignar', revisorRol: p.revisor_rol || 'Auditor',
   instruccion: p.instruccion || p.nombre_tarea || '', generaTarea: p.genera_tarea!==false,
   plazoResolver: p.plazo_resolver_dias ?? 5, plazoAprobar: p.plazo_aprobar_dias ?? 3
  })).sort((a,b)=> a.secOrden-b.secOrden || a.orden-b.orden);
  SUCURSALES = (suc||[]).map(s=>({c:s.centro, t:s.tienda, r:s.razon_social_clave}));
  RAZONES = {}; (raz||[]).forEach(r=>{ RAZONES[r.clave] = r.nombre + (r.supervisor_nombre?(' — '+r.supervisor_nombre):''); });
  localStorage.setItem('cl_cache_v1', JSON.stringify({PUNTOS,SUCURSALES,RAZONES}));
  return true;
 }catch(err){
  const cache = localStorage.getItem('cl_cache_v1');
  if(cache){
   try{ const c = JSON.parse(cache); PUNTOS=c.PUNTOS; SUCURSALES=c.SUCURSALES; RAZONES=c.RAZONES; toast('Sin conexión: usando el checklist guardado localmente'); return true; }catch(e2){}
  }
  return false;
 }
}

function poblarSucursales(){
 const selSuc = document.getElementById('selSucursal');
 selSuc.innerHTML = '';
 const porRazon = {};
 SUCURSALES.forEach(s=>{ (porRazon[s.r] = porRazon[s.r]||[]).push(s); });
 Object.keys(porRazon).forEach(r=>{
  const og = document.createElement('optgroup'); og.label = RAZONES[r] || r;
  porRazon[r].forEach(s=>{ const o=document.createElement('option'); o.value=s.c; o.textContent=s.c+' — '+s.t; og.appendChild(o); });
  selSuc.appendChild(og);
 });
 const bloqueada = PERFIL.sucursal_centro && ROLES_BLOQUEADOS_SUCURSAL.includes(PERFIL.puesto);
 if(bloqueada && SUCURSALES.some(s=>s.c===PERFIL.sucursal_centro)){
  state.sucursal = PERFIL.sucursal_centro; selSuc.value = state.sucursal; selSuc.disabled = true;
 } else {
  state.sucursal = (SUCURSALES.some(s=>s.c===state.sucursal) && state.sucursal) || (SUCURSALES[0] && SUCURSALES[0].c);
  selSuc.value = state.sucursal; selSuc.disabled = false;
 }
 selSuc.onchange = e=>{ state.sucursal = e.target.value; guardarBorrador(); render(); };
}

async function cargarTareas(){
 try{
  const {data, error} = await sb.from('tareas')
   .select('*, respuestas(punto_id, auditoria_id, auditorias(sucursal_centro, tienda)), responsable:usuarios!tareas_responsable_id_fkey(id,nombre), revisor:usuarios!tareas_revisor_id_fkey(id,nombre)')
   .order('fecha_creacion', {ascending:false}).limit(400);
  if(error) throw error;
  TASKS = (data||[]).map(t=>{
   const punto = PUNTOS.find(p=>p.id===t.respuestas?.punto_id);
   let estado = {abierta:'Pendiente', ejecutada:'PorAprobar', aprobada:'Finalizada', rechazada:'Pendiente'}[t.estado] || t.estado;
   if(estado==='Pendiente' && t.fecha_limite_resolver && new Date(t.fecha_limite_resolver)<new Date()) estado='Vencida';
   return {
    id:t.id, texto: punto?.texto || '(pregunta no disponible)', area: punto?.area || 'Sin asignar', instruccion: punto?.instruccion || '',
    sucursal: t.respuestas?.auditorias?.sucursal_centro || '—', estado,
    responsable_id: t.responsable_id, revisor_id: t.revisor_id,
    // Todas las personas que pueden resolverla (p. ej. los dos gerentes de una sucursal)
    responsables: (t.responsables && t.responsables.length) ? t.responsables : (t.responsable_id ? [t.responsable_id] : []),
    responsableNombre: t.responsable?.nombre || null, revisorNombre: t.revisor?.nombre || null,
    diasResolver: diasRestantes(t.fecha_limite_resolver), diasAprobar: diasRestantes(t.fecha_limite_aprobar),
    aprobacionVencida: estado==='PorAprobar' && t.fecha_limite_aprobar && new Date(t.fecha_limite_aprobar)<new Date(),
    plazoResolver: punto?.plazoResolver ?? 5, plazoAprobar: punto?.plazoAprobar ?? 3,
    colabComentario: t.comentario_ejecucion || '', auditorComentario: t.motivo_rechazo || '',
    fotos: []
   };
  });
  await Promise.all([cargarEvidencias(), cargarNombres(TASKS.flatMap(t=>t.responsables))]);
  TASKS.forEach(t=>{ t.responsablesNombres = t.responsables.map(id=>NOMBRES[id]).filter(Boolean); });
 }catch(err){ toast('No se pudieron cargar las tareas: '+(err.message||err)); TASKS = []; }
}

// Nombres de usuarios por id (para mostrar a todos los responsables de una tarea)
const NOMBRES = {};
async function cargarNombres(ids){
 const faltan = [...new Set(ids)].filter(id=>id && !NOMBRES[id]); if(!faltan.length) return;
 try{
  const {data, error} = await sb.from('usuarios').select('id, nombre').in('id', faltan);
  if(error) throw error;
  (data||[]).forEach(u=>{ NOMBRES[u.id] = u.nombre; });
 }catch(err){ /* se muestran sin nombre */ }
}
function esResponsable(t){ return t.responsable_id===PERFIL.id || (t.responsables||[]).includes(PERFIL.id); }

// Fotos de cada tarea. Se firman al momento de verlas (enlaces de 1 hora).
async function cargarEvidencias(){
 const ids = TASKS.map(t=>t.id); if(!ids.length) return;
 try{
  const {data, error} = await sb.from('evidencias').select('tarea_id, url_archivo').in('tarea_id', ids).order('fecha');
  if(error) throw error;
  const porTarea = {};
  (data||[]).forEach(e=>{ (porTarea[e.tarea_id] = porTarea[e.tarea_id]||[]).push(e.url_archivo); });
  const rutas = [...new Set((data||[]).map(e=>e.url_archivo).filter(u=>!/^https?:/i.test(u)))];
  const firmadas = {};
  if(rutas.length){
   const {data:urls} = await sb.storage.from('evidencias').createSignedUrls(rutas, 60*60);
   (urls||[]).forEach(u=>{ if(u.signedUrl) firmadas[u.path] = u.signedUrl; });
  }
  TASKS.forEach(t=>{ t.fotos = (porTarea[t.id]||[]).map(u=> /^https?:/i.test(u) ? u : firmadas[u]).filter(Boolean); });
 }catch(err){ /* sin fotos, la tarea se muestra igual */ }
}

async function cargarHistorial(){
 try{
  const {data, error} = await sb.from('historial').select('*').order('fecha', {ascending:false}).limit(40);
  if(error) throw error;
  NOTIFS = (data||[]).map(h=>({t:fechaHora(h.fecha), msg:h.accion}));
 }catch(err){ /* deja NOTIFS vacío si falla */ }
}

function suscribirHistorialRealtime(){
 if(realtimeCh) return;
 realtimeCh = sb.channel('historial-feed')
  .on('postgres_changes', {event:'INSERT', schema:'public', table:'historial'}, payload=>{
   NOTIFS.unshift({t:fechaHora(payload.new.fecha||Date.now()), msg:payload.new.accion});
   if(state.view==='dash') renderDash();
  }).subscribe();
}

// Reduce la foto de la cámara (5–10 MB) a JPEG de máx. 1600 px (~300 KB)
async function comprimirImagen(file, maxLado=1600, calidad=0.75){
 if(!file.type.startsWith('image/')) return file;
 try{
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, maxLado/Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width*k); c.height = Math.round(bmp.height*k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  const blob = await new Promise(r=>c.toBlob(r, 'image/jpeg', calidad));
  return (blob && blob.size < file.size) ? blob : file;
 }catch(e){ return file; }
}

// Devuelve la RUTA dentro del bucket (no un enlace): el enlace se genera al mostrarla
async function subirEvidencia(file, carpeta){
 const img = await comprimirImagen(file);
 const ext = img===file ? (file.name.split('.').pop()||'jpg') : 'jpg';
 const path = `${carpeta}/${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
 const {error} = await sb.storage.from('evidencias').upload(path, img, {upsert:false, contentType: img.type || 'image/jpeg'});
 if(error) throw error;
 return path;
}

/* ===================== FIRMAS (canvas, opcional) ===================== */
function initFirma(canvasId, stateKey){
 const canvas = $(canvasId); if(!canvas) return;
 const ctx = canvas.getContext('2d');
 // Trazo oscuro fijo: la firma debe verse igual al imprimirla, aunque la app esté en modo oscuro
 ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.strokeStyle = '#1B2430';
 if(state[stateKey]){ const img = new Image(); img.onload=()=>ctx.drawImage(img,0,0); img.src = state[stateKey]; }
 let drawing = false;
 // Escala por si el canvas se ve más pequeño que su tamaño interno (pantallas angostas)
 function pos(e){ const r = canvas.getBoundingClientRect(); const p = e.touches ? e.touches[0] : e; return {x:(p.clientX-r.left)*canvas.width/r.width, y:(p.clientY-r.top)*canvas.height/r.height}; }
 function start(e){ drawing = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); e.preventDefault(); }
 function move(e){ if(!drawing) return; const p = pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); e.preventDefault(); }
 function end(){ if(!drawing) return; drawing = false; state[stateKey] = canvas.toDataURL('image/png'); guardarBorrador(); }
 canvas.onpointerdown = e=>{ canvas.setPointerCapture(e.pointerId); start(e); };
 canvas.onpointermove = move; canvas.onpointerup = end; canvas.onpointercancel = end;
}
function limpiarFirma(canvasId, stateKey){ const c = $(canvasId); c.getContext('2d').clearRect(0,0,c.width,c.height); state[stateKey] = null; guardarBorrador(); }

/* ===================== ESTADO DE LA VISTA ===================== */
function estadoAuditoriaVacio(){
 return { respuestas:{}, comentarios:{}, fotos:{}, fotoFiles:{}, firmaJefe:null, firmaGerente:null, nombreJefe:'', nombreGerente:'', ultimoResultado:'', envio:null };
}
let state = Object.assign({ sucursal:null, view:'audit', rolTareas:'Jefe de Almacén' }, estadoAuditoriaVacio());

/* ---------- borrador local: si se recarga la página o se va la señal, no se pierde la auditoría ---------- */
function claveBorrador(){ return PERFIL ? 'cl_borrador_'+PERFIL.id : null; }
function guardarBorrador(){
 const k = claveBorrador(); if(!k) return;
 const {sucursal, respuestas, comentarios, firmaJefe, firmaGerente, nombreJefe, nombreGerente} = state;
 try{
  if(!Object.keys(respuestas).length && !firmaJefe && !firmaGerente) localStorage.removeItem(k);
  else localStorage.setItem(k, JSON.stringify({sucursal, respuestas, comentarios, firmaJefe, firmaGerente, nombreJefe, nombreGerente}));
 }catch(e){ /* almacenamiento lleno o bloqueado: se sigue sin borrador */ }
}
function cargarBorrador(){
 const k = claveBorrador(); if(!k) return;
 try{
  const b = JSON.parse(localStorage.getItem(k) || 'null'); if(!b) return;
  if(b.sucursal && b.sucursal!==state.sucursal && !$('selSucursal').disabled && SUCURSALES.some(s=>s.c===b.sucursal)){
   state.sucursal = b.sucursal; $('selSucursal').value = b.sucursal;
  }
  Object.assign(state, {respuestas:b.respuestas||{}, comentarios:b.comentarios||{}, firmaJefe:b.firmaJefe||null, firmaGerente:b.firmaGerente||null, nombreJefe:b.nombreJefe||'', nombreGerente:b.nombreGerente||''});
  const n = Object.keys(state.respuestas).length;
  if(n) toast(`Se recuperó una auditoría en curso (${n} respuestas). Las fotos hay que volver a adjuntarlas.`);
 }catch(e){}
}

document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click', async ()=>{
 state.view = b.dataset.v;
 document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on', x===b));
 if(state.view==='dash') await Promise.all([cargarHistorial(), cargarDash()]);
 render();
}));

function sucursalObj(c){ return SUCURSALES.find(s=>s.c===c); }
function incumple(q, valor){ return q.tipo==='Negativo' ? valor==='Si' : valor==='No'; }
// La foto solo se guarda como evidencia de una tarea, así que solo se pide cuando la respuesta genera una
function pideFoto(q){ const v = state.respuestas[q.id]; return !!v && incumple(q, v) && q.generaTarea; }

/* ===================== VISTA: AUDITORÍA ===================== */
function renderAudit(){
 const s = sucursalObj(state.sucursal);
 const preguntas = PUNTOS;
 const contestadas = preguntas.filter(q=>state.respuestas[q.id]).length;
 const faltan = preguntas.length - contestadas;
 let html = `<h1 class="pt">Calificar check list</h1><p class="sub">${s?esc(s.c+' · '+s.t):'Selecciona una sucursal'} · folio se genera al calificar</p>
  <div class="progwrap"><div class="progtrack"><div class="progfill" style="width:${preguntas.length?contestadas/preguntas.length*100:0}%"></div></div><span class="progtxt">${contestadas}/${preguntas.length} contestadas</span></div>`;
 let lastSec = '';
 preguntas.forEach(q=>{
  if(q.sec!==lastSec){ html += `<div class="sec-title">${esc(q.sec)}</div>`; lastSec = q.sec; }
  const v = state.respuestas[q.id];
  // Rojo = no cumple, verde = cumple (depende de si la pregunta es positiva o negativa)
  const cls = val => v===val ? (incumple(q,val)?'sel-si':'sel-no') : '';
  const foto = state.fotos[q.id];
  html += `<div class="card">
   <div class="qrow">
    <div class="qtxt" id="qt-${q.id}">${esc(q.texto)}</div>
    <div class="toggle" data-q="${q.id}" role="group" aria-labelledby="qt-${q.id}">
     <button type="button" data-v="Si" class="${cls('Si')}" aria-pressed="${v==='Si'}">Sí</button>
     <button type="button" data-v="No" class="${cls('No')}" aria-pressed="${v==='No'}">No</button>
    </div>
   </div>
   <div class="qmore">
    <textarea placeholder="Comentario (opcional)" data-c="${q.id}" rows="1">${esc(state.comentarios[q.id])}</textarea>
    ${pideFoto(q) ? `<button type="button" class="foto-btn ${foto?'on':''}" data-f="${q.id}">${foto?'📷 Foto adjunta':'📷 Adjuntar foto'}</button>
    <input type="file" accept="image/*" capture="environment" style="display:none" data-finput="${q.id}">` : ''}
   </div>
  </div>`;
 });
 const firma = (id, etiqueta, nombreKey) => `<div style="margin-bottom:16px">
   <label style="font-size:12.5px;color:var(--ink-soft);display:block;margin-bottom:4px" for="${nombreKey}">${etiqueta}</label>
   <input class="firma-nombre" id="${nombreKey}" placeholder="Nombre de quien firma" value="${esc(state[nombreKey])}" autocomplete="off">
   <canvas id="${id}" width="300" height="90" style="border:1px solid var(--line);border-radius:3px;background:#FFFFFF;touch-action:none;display:block;max-width:100%"></canvas>
   <button type="button" class="linkbtn" data-limpiar="${id}">Limpiar firma</button>
  </div>`;
 html += `<div class="sec-title">Firmas de conformidad (opcional)</div><div class="card firmas">
  ${firma('firmaJefe','Firma del jefe de almacén','nombreJefe')}
  ${firma('firmaGerente','Firma del gerente','nombreGerente')}
 </div>`;
 html += `<div id="resultBox">${state.ultimoResultado}</div><div class="stickybar">${faltan?`<span class="aviso">Faltan ${faltan} pregunta(s)</span>`:''}<button class="btn" id="btnCalificar" ${faltan||!preguntas.length?'disabled':''}>Calificar y generar tareas</button></div>`;
 document.getElementById('app').innerHTML = html;

 document.querySelectorAll('.toggle button').forEach(b=>b.addEventListener('click', e=>{
  const qid = e.currentTarget.parentElement.dataset.q;
  if(state.envio?.respuestas){ toast('Las respuestas ya se guardaron; pulsa "Reintentar" para terminar el envío'); return; }
  state.respuestas[qid] = e.currentTarget.dataset.v;
  const q = PUNTOS.find(x=>x.id===qid);
  if(q && !pideFoto(q)){ delete state.fotos[qid]; delete state.fotoFiles[qid]; }
  state.ultimoResultado = '';
  guardarBorrador();
  renderAudit();
 }));
 document.querySelectorAll('[data-c]').forEach(t=>t.addEventListener('input', e=>{ state.comentarios[e.target.dataset.c]=e.target.value; guardarBorrador(); }));
 ['nombreJefe','nombreGerente'].forEach(k=> $(k).addEventListener('input', e=>{ state[k]=e.target.value; guardarBorrador(); }));
 document.querySelectorAll('[data-f]').forEach(b=>b.addEventListener('click', e=>{
  document.querySelector(`[data-finput="${e.currentTarget.dataset.f}"]`).click();
 }));
 document.querySelectorAll('[data-finput]').forEach(inp=>inp.addEventListener('change', e=>{
  const id = e.target.dataset.finput; const f = e.target.files[0];
  if(f){ state.fotoFiles[id]=f; state.fotos[id]=true; renderAudit(); }
 }));
 initFirma('firmaJefe','firmaJefe'); initFirma('firmaGerente','firmaGerente');
 document.querySelectorAll('[data-limpiar]').forEach(b=>b.addEventListener('click', ()=>limpiarFirma(b.dataset.limpiar, b.dataset.limpiar)));
 const btnCal = document.getElementById('btnCalificar');
 if(btnCal) btnCal.addEventListener('click', calificar);
}

async function calificar(){
 const s = sucursalObj(state.sucursal);
 const respondidas = PUNTOS.filter(q=>state.respuestas[q.id]).map(q=>[q, state.respuestas[q.id]]);
 if(!s){ toast('Selecciona una sucursal'); return; }
 if(respondidas.length < PUNTOS.length){ toast('Contesta todas las preguntas antes de calificar'); return; }
 if(state.firmaJefe && !state.nombreJefe.trim()){ toast('Escribe el nombre del jefe de almacén que firma'); $('nombreJefe').focus(); return; }
 if(state.firmaGerente && !state.nombreGerente.trim()){ toast('Escribe el nombre del gerente que firma'); $('nombreGerente').focus(); return; }

 const btn = document.getElementById('btnCalificar'); btn.disabled = true; btn.textContent = 'Guardando…';
 try{
  const incumplidas = respondidas.filter(([q,v])=>incumple(q,v)).length;
  const pct = respondidas.length ? Math.round((1 - incumplidas/respondidas.length)*100) : 100;

  // 1) La auditoría se crea "en_proceso". Si algo falla después, al reintentar se reutiliza
  //    (no se duplica) y solo se marca "cerrada" cuando todo quedó guardado.
  if(!state.envio || state.envio.sucursal!==s.c){
   const {data:auditoria, error:e1} = await sb.from('auditorias').insert({
    tienda: s.t, auditor_id: PERFIL.id, auditor_nombre: PERFIL.nombre, sucursal_centro: s.c, estado:'en_proceso'
   }).select('id').single();
   if(e1) throw e1;
   state.envio = {sucursal:s.c, auditoriaId:auditoria.id, respuestas:null, firmas:false, fotos:{}};
  }
  const envio = state.envio;

  // 2) Todas las respuestas en un solo insert: se guardan todas o ninguna.
  //    La base de datos genera las tareas (trigger trg_respuesta_tarea).
  if(!envio.respuestas){
   const {data:resps, error:e2} = await sb.from('respuestas').insert(respondidas.map(([q,v])=>({
    auditoria_id:envio.auditoriaId, punto_id:q.id, valor: v==='Si'?'si':'no',
    es_no_conforme: incumple(q,v), comentario:(state.comentarios[q.id]||'').trim()
   }))).select('id, punto_id');
   if(e2) throw e2;
   envio.respuestas = {}; (resps||[]).forEach(r=>{ envio.respuestas[r.punto_id] = r.id; });
  }

  if(!envio.firmas){
   const firmas = [];
   if(state.firmaJefe) firmas.push({auditoria_id:envio.auditoriaId, rol_firmante:'Jefe de almacén', nombre:state.nombreJefe.trim(), imagen_firma:state.firmaJefe});
   if(state.firmaGerente) firmas.push({auditoria_id:envio.auditoriaId, rol_firmante:'Gerente', nombre:state.nombreGerente.trim(), imagen_firma:state.firmaGerente});
   if(firmas.length){ const {error:e3} = await sb.from('firmas').insert(firmas); if(e3) throw e3; }
   envio.firmas = true;
  }

  // 3) Tareas generadas por la base de datos, para mostrarlas y adjuntarles la foto
  const conTarea = respondidas.filter(([q,v])=>incumple(q,v) && q.generaTarea);
  const idsResp = conTarea.map(([q])=>envio.respuestas[q.id]).filter(Boolean);
  let tareas = [];
  if(idsResp.length){
   const {data, error:e4} = await sb.from('tareas')
    .select('id, respuesta_id, responsables').in('respuesta_id', idsResp);
   if(e4) throw e4;
   tareas = data||[];
   await cargarNombres(tareas.flatMap(t=>t.responsables||[]));
  }
  let fotosFallidas = 0;
  const creadas = conTarea.map(([q])=>{
   const tarea = tareas.find(t=>t.respuesta_id===envio.respuestas[q.id]);
   return {q, tarea};
  });
  for(const {q, tarea} of creadas){
   if(!state.fotoFiles[q.id] || envio.fotos[q.id]) continue;
   if(!tarea){ fotosFallidas++; continue; }
   try{
    const ruta = await subirEvidencia(state.fotoFiles[q.id], envio.auditoriaId);
    const {error:e5} = await sb.from('evidencias').insert({tarea_id:tarea.id, url_archivo:ruta, subido_por:PERFIL.id});
    if(e5) throw e5;
    envio.fotos[q.id] = true;
   }catch(errFoto){ fotosFallidas++; }
  }

  const {error:e6} = await sb.from('auditorias').update({estado:'cerrada', porcentaje_cumplimiento:pct}).eq('id', envio.auditoriaId);
  if(e6) throw e6;

  state.ultimoResultado = `<div class="result"><strong>Cumplimiento: ${pct}%</strong> · ${esc(s.t)}<br>` + (creadas.length
   ? `${creadas.length} tarea(s) generada(s):<ul style="margin:8px 0 0">${creadas.map(({q,tarea})=>`<li>${esc(q.texto)} — ${tarea?.responsables?.length ? esc(tarea.responsables.map(id=>NOMBRES[id]||'—').join(', ')) : 'sin responsable asignado ('+esc(q.area)+')'}</li>`).join('')}</ul>`
   : 'Sin incumplimientos. No se generaron tareas.')
   + (fotosFallidas ? `<p style="margin:8px 0 0;color:var(--venc)">${fotosFallidas} foto(s) no se pudieron subir.</p>` : '') + `</div>`;
  toast(creadas.length ? `Check list calificado — ${creadas.length} tarea(s) generada(s)` : 'Check list calificado');
  const resultado = state.ultimoResultado;
  Object.assign(state, estadoAuditoriaVacio(), {ultimoResultado:resultado, envio:null});
  guardarBorrador();
  await cargarTareas();
  renderAudit();
  window.scrollTo({top:0, behavior:'smooth'});
 }catch(err){
  toast('No se pudo guardar la auditoría: '+(err.message||err)+'. Puedes reintentar sin que se duplique.');
  btn.disabled = false; btn.textContent = 'Reintentar';
 }
}

/* ===================== VISTA: TAREAS ===================== */
function renderTasks(){
 const s = sucursalObj(state.sucursal);
 const esAdmin = PERFIL.rol==='Administrador' || PERFIL.rol==='Supervisor';
 let html = `<h1 class="pt">Tareas</h1><p class="sub">${s?s.c+' · '+s.t:''}</p>`;
 if(esAdmin){
  html += `<div class="filters"><label style="font-size:12.5px;color:var(--ink-soft)">Ver como&nbsp;
   <select id="rolSel">
    <option ${state.rolTareas==='Jefe de Almacén'?'selected':''}>Jefe de Almacén</option>
    <option ${state.rolTareas==='Gerente'?'selected':''}>Gerente</option>
    <option ${state.rolTareas==='Auditor'?'selected':''}>Auditor</option>
   </select></label></div>`;
 }
 const suc = TASKS.filter(t=>t.sucursal===state.sucursal);
 let list;
 if(esAdmin){
  list = state.rolTareas==='Auditor' ? suc.filter(t=>t.estado==='PorAprobar') : suc.filter(t=>t.estado==='Pendiente'||t.estado==='Vencida');
 } else if(PERFIL.puesto==='Auditor'){
  list = suc.filter(t=>t.revisor_id===PERFIL.id && t.estado==='PorAprobar');
 } else {
  list = suc.filter(t=>esResponsable(t) && (t.estado==='Pendiente'||t.estado==='Vencida'));
 }
 const modoAuditor = esAdmin ? state.rolTareas==='Auditor' : PERFIL.puesto==='Auditor';
 html += list.length ? '' : `<div class="empty">No hay tareas ${modoAuditor?'por aprobar':'pendientes'} en esta sucursal.</div>`;
 list.forEach(t=> html += modoAuditor ? taskCardAuditor(t) : taskCardColab(t));
 document.getElementById('app').innerHTML = html;

 const rolSel = document.getElementById('rolSel');
 if(rolSel) rolSel.addEventListener('change', e=>{ state.rolTareas = e.target.value; renderTasks(); });

 document.querySelectorAll('[data-f]').forEach(b=>b.addEventListener('click', e=>{
  document.querySelector(`[data-finput="${e.currentTarget.dataset.f}"]`).click();
 }));
 document.querySelectorAll('[data-finput]').forEach(inp=>inp.addEventListener('change', e=>{
  const id = e.target.dataset.finput; const f = e.target.files[0];
  if(f){ pendingTaskFile[id]=f; const b=document.querySelector(`[data-f="${id}"]`); b.classList.add('on'); b.textContent='📷 Foto adjunta'; }
 }));
 document.querySelectorAll('[data-send]').forEach(b=>b.addEventListener('click', async e=>{
  const id = e.target.dataset.send;
  const c = document.querySelector(`[data-cin="${id}"]`).value.trim();
  if(!c){ toast('Agrega un comentario antes de enviar a aprobación'); document.querySelector(`[data-cin="${id}"]`).focus(); return; }
  e.target.disabled = true;
  try{
   const t = TASKS.find(x=>x.id===id);
   // Primero la foto: si falla, la tarea no se envía sin su evidencia
   if(pendingTaskFile[id]){
    const ruta = await subirEvidencia(pendingTaskFile[id], id);
    const {error:eF} = await sb.from('evidencias').insert({tarea_id:id, url_archivo:ruta, subido_por:PERFIL.id});
    if(eF) throw eF;
    delete pendingTaskFile[id];
   }
   const {error} = await sb.from('tareas').update({estado:'ejecutada', comentario_ejecucion:c, fecha_ejecucion:new Date().toISOString(), fecha_limite_aprobar:addDias(t?.plazoAprobar ?? 3)}).eq('id', id);
   if(error) throw error;
   await registrarHistorial(null, `"${t?.texto||id}" (${t?.sucursal||''}) enviada a aprobación por ${PERFIL.nombre}`);
   toast('Tarea enviada a aprobación');
   await cargarTareas(); renderTasks();
  }catch(err){ toast('No se pudo enviar la tarea: '+(err.message||err)); e.target.disabled = false; }
 }));
 document.querySelectorAll('[data-ap]').forEach(b=>b.addEventListener('click', async e=>{
  const id = e.target.dataset.ap; e.target.disabled = true;
  try{
   const {error} = await sb.from('tareas').update({estado:'aprobada', fecha_decision:new Date().toISOString()}).eq('id', id);
   if(error) throw error;
   const t = TASKS.find(x=>x.id===id);
   await registrarHistorial(null, `"${t?.texto||id}" (${t?.sucursal||''}) aprobada y finalizada por ${PERFIL.nombre}`);
   toast('Tarea aprobada y finalizada');
   await cargarTareas(); renderTasks();
  }catch(err){ toast('No se pudo aprobar: '+(err.message||err)); e.target.disabled = false; }
 }));
 document.querySelectorAll('[data-rj]').forEach(b=>b.addEventListener('click', async e=>{
  const id = e.target.dataset.rj;
  const c = document.querySelector(`[data-rjc="${id}"]`).value.trim();
  if(!c){ toast('Indica el motivo del rechazo'); document.querySelector(`[data-rjc="${id}"]`).focus(); return; }
  e.target.disabled = true;
  try{
   const t = TASKS.find(x=>x.id===id);
   const {error} = await sb.from('tareas').update({estado:'rechazada', motivo_rechazo:c, fecha_decision:new Date().toISOString(), fecha_limite_resolver:addDias(t?.plazoResolver ?? 5)}).eq('id', id);
   if(error) throw error;
   await registrarHistorial(null, `"${t?.texto||id}" (${t?.sucursal||''}) rechazada por ${PERFIL.nombre}`);
   toast('Tarea rechazada, regresa al colaborador');
   await cargarTareas(); renderTasks();
  }catch(err){ toast('No se pudo rechazar: '+(err.message||err)); e.target.disabled = false; }
 }));
}
function badge(t){
 return t.estado==='Pendiente'?'<span class="badge b-pend">Pendiente</span>'
  :t.estado==='Vencida'?'<span class="badge b-venc">Vencida</span>'
  :t.estado==='PorAprobar'?(t.aprobacionVencida?'<span class="badge b-venc">Aprobación vencida</span>':'<span class="badge b-rev">Por aprobar</span>')
  :'<span class="badge b-done">Finalizada</span>';
}
function fotosHtml(t){
 return t.fotos && t.fotos.length ? `<div class="fotos">${t.fotos.map((u,i)=>`<a href="${esc(u)}" target="_blank" rel="noopener" title="Ver foto ${i+1}"><img src="${esc(u)}" alt="Evidencia ${i+1}" loading="lazy"></a>`).join('')}</div>` : '';
}
function plazoTxt(d, verbo){ return d==null ? '' : d<0 ? ` · ${verbo} venció hace ${-d} día(s)` : d===0 ? ` · ${verbo} vence hoy` : ` · ${verbo} en ${d} día(s)`; }
function taskCardColab(t){
 return `<div class="taskcard"><div class="taskhead"><h4>${esc(t.texto)}</h4>${badge(t)}</div>
  <div class="meta">${esc(t.sucursal)} · ${esc(t.area)}${plazoTxt(t.diasResolver,'resolver')}</div>
  <div class="evid"><strong>Instrucción:</strong> ${esc(t.instruccion)||'—'}</div>
  ${fotosHtml(t)}
  ${t.auditorComentario?`<div class="evid" style="border-color:var(--venc);background:var(--vencbg)"><strong>Rechazada por el auditor:</strong> ${esc(t.auditorComentario)}</div>`:''}
  <textarea rows="2" placeholder="Comentario al resolver" data-cin="${t.id}" style="width:100%;border:1px solid var(--line);border-radius:3px;padding:7px 9px;background:var(--paper);color:var(--ink)"></textarea>
  <div class="row2"><button type="button" class="foto-btn" data-f="${t.id}">📷 Adjuntar foto</button><input type="file" accept="image/*" capture="environment" style="display:none" data-finput="${t.id}"><button class="btn" data-send="${t.id}">Enviar a aprobación</button></div>
 </div>`;
}
function taskCardAuditor(t){
 return `<div class="taskcard"><div class="taskhead"><h4>${esc(t.texto)}</h4>${badge(t)}</div>
  <div class="meta">${esc(t.sucursal)} · ${esc(t.area)}${plazoTxt(t.diasAprobar,'aprobar')}${t.responsablesNombres?.length?' · responsable(s): '+esc(t.responsablesNombres.join(', ')):''}</div>
  <div class="evid"><strong>Evidencia del colaborador:</strong> ${esc(t.colabComentario)||'—'}</div>
  ${t.fotos && t.fotos.length ? fotosHtml(t) : '<div class="meta">Sin fotos adjuntas.</div>'}
  <textarea rows="2" placeholder="Comentario (obligatorio si rechazas)" data-rjc="${t.id}" style="width:100%;border:1px solid var(--line);border-radius:3px;padding:7px 9px;background:var(--paper);color:var(--ink)"></textarea>
  <div class="row2"><button class="btn" data-ap="${t.id}">Aprobar</button><button class="btn ghost" data-rj="${t.id}">Rechazar</button></div>
 </div>`;
}

/* ===================== VISTA: REPORTES ===================== */
// Los totales se cuentan en la base de datos (no dependen de cuántas tareas se cargaron en pantalla)
async function cargarDash(){
 const ahora = new Date().toISOString();
 const contar = q => q.then(({count, error})=>{ if(error) throw error; return count||0; });
 const base = () => sb.from('tareas').select('id', {count:'exact', head:true});
 try{
  const desde = addDias(-90);
  const [pend, venc, rev, done, auds] = await Promise.all([
   contar(base().in('estado',['abierta','rechazada']).or(`fecha_limite_resolver.is.null,fecha_limite_resolver.gte."${ahora}"`)),
   contar(base().in('estado',['abierta','rechazada']).lt('fecha_limite_resolver', ahora)),
   contar(base().eq('estado','ejecutada')),
   contar(base().eq('estado','aprobada')),
   sb.from('auditorias').select('sucursal_centro, porcentaje_cumplimiento, fecha').eq('estado','cerrada').gte('fecha', desde).order('fecha', {ascending:false}).limit(2000)
  ]);
  if(auds.error) throw auds.error;
  const porSuc = {};
  (auds.data||[]).forEach(a=>{
   if(a.porcentaje_cumplimiento==null) return;
   const p = porSuc[a.sucursal_centro] = porSuc[a.sucursal_centro] || {ultima:Number(a.porcentaje_cumplimiento), fecha:a.fecha, suma:0, n:0};
   p.suma += Number(a.porcentaje_cumplimiento); p.n++;
  });
  DASH = {pend, venc, rev, done, cumplimiento: Object.entries(porSuc).map(([c,p])=>({c, ultima:p.ultima, fecha:p.fecha, prom:Math.round(p.suma/p.n), n:p.n})).sort((a,b)=>a.prom-b.prom)};
 }catch(err){ DASH = null; toast('No se pudieron calcular los totales: '+(err.message||err)); }
}

function renderDash(){
 const suc = TASKS;
 const c = e=>suc.filter(t=>t.estado===e).length;
 const n = (k, e) => DASH ? DASH[k] : c(e);
 let html = `<h1 class="pt">Reportes</h1><p class="sub">Todas las sucursales · datos en vivo desde Supabase</p>
  <div class="stat-grid">
   <div class="stat pend"><div class="n">${n('pend','Pendiente')}</div><div class="l">Pendientes</div></div>
   <div class="stat venc"><div class="n">${n('venc','Vencida')}</div><div class="l">Vencidas</div></div>
   <div class="stat rev"><div class="n">${n('rev','PorAprobar')}</div><div class="l">Por aprobar</div></div>
   <div class="stat done"><div class="n">${n('done','Finalizada')}</div><div class="l">Finalizadas</div></div>
  </div>`;
 html += `<div class="sec-title">Cumplimiento por sucursal (últimos 90 días)</div>`;
 html += DASH && DASH.cumplimiento.length
  ? `<table class="rtable"><tr><th>Sucursal</th><th>Última</th><th>Promedio</th><th>Auditorías</th><th>Última fecha</th></tr>${DASH.cumplimiento.map(r=>{ const s=sucursalObj(r.c); const col = r.prom>=90?'var(--done)':r.prom>=75?'var(--rev)':'var(--venc)';
     return `<tr><td data-label="Sucursal">${esc(r.c)}${s?' · '+esc(s.t):''}</td><td data-label="Última">${r.ultima}%</td><td data-label="Promedio" style="color:${col};font-weight:600">${r.prom}%</td><td data-label="Auditorías">${r.n}</td><td data-label="Última fecha">${esc(new Date(r.fecha).toLocaleDateString('es-MX'))}</td></tr>`; }).join('')}</table>`
  : '<div class="empty">Sin auditorías cerradas en los últimos 90 días.</div>';
 const bySuc = {};
 suc.filter(t=>t.estado==='Pendiente'||t.estado==='Vencida').forEach(t=>{ bySuc[t.sucursal]=(bySuc[t.sucursal]||0)+1; });
 const top = Object.entries(bySuc).sort((a,b)=>b[1]-a[1]).slice(0,6);
 const max = top.length? top[0][1] : 1;
 html += `<div class="sec-title">Sucursales con más tareas abiertas</div><div class="bars">`;
 html += top.length ? top.map(([sc,n])=>{ const s=sucursalObj(sc); return `<div class="bar-row"><span>${esc(sc)} ${s?('· '+esc(s.t)):''}</span><div class="bar-track"><div class="bar-fill" style="width:${n/max*100}%"></div></div><span>${n}</span></div>`; }).join('') : '<div class="empty">Sin tareas abiertas.</div>';
 html += `</div>`;
 html += `<div class="sec-title">Detalle (tareas más recientes)</div><table class="rtable"><tr><th>Sucursal</th><th>Pregunta</th><th>Área</th><th>Estado</th></tr>`;
 html += suc.slice(0,30).map(t=>`<tr><td data-label="Sucursal">${esc(t.sucursal)}</td><td data-label="Pregunta">${esc(t.texto)}</td><td data-label="Área">${esc(t.area)}</td><td data-label="Estado">${badge(t)}</td></tr>`).join('');
 html += `</table>`;
 html += `<div class="sec-title">Notificaciones (historial real de Supabase)</div><div class="notiffeed" id="feed">${NOTIFS.length?NOTIFS.map(n=>`<div>${esc(n.t)} — ${esc(n.msg)}</div>`).join(''):'<div>Sin notificaciones aún.</div>'}</div>`;
 document.getElementById('app').innerHTML = html;
}

function render(){
 if(!PERFIL) return;
 document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on', x.dataset.v===state.view));
 if(state.view==='audit') renderAudit();
 else if(state.view==='tasks') renderTasks();
 else renderDash();
}
</script>
</body>
</html>
